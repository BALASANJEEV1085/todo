name: Build & Deploy to EC2 Docker

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 759204735992.dkr.ecr.ap-south-1.amazonaws.com
  ECR_REPOSITORY: todo
  INSTANCE_ID: i-02efa66629e5a2cea
  SERVER_NAME: todo-server
  PUBLIC_URL: http://43.204.71.54
  CONTAINER_PORT: "80"
  HOST_PORT: "80"
  DOCKERFILE_PATH: .

jobs:
  build-diagnose:
    name: Build Static App & Diagnostics
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (host-side diagnostics only; image builds inside Docker)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Diagnostics - toolchain and repo layout
        run: |
          set -e
          echo "==> Node/npm versions (host)"
          node --version || true
          npm --version || true
          echo "==> Repository layout"
          ls -la
          test -f package.json && echo "package.json: OK"
          test -f Dockerfile && echo "Dockerfile: OK"
          test -f public/index.html && echo "public/index.html: OK"
          test -d src && echo "src/: OK"
          echo "==> package.json scripts"
          cat package.json

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (node:20-alpine builder -> nginx:alpine) with diagnostics
        run: |
          set -e
          echo "==> Building react-todo-app image from context '${DOCKERFILE_PATH}' (EXPOSE ${CONTAINER_PORT})"
          docker build --progress=plain --tag react-todo-app:ci "${DOCKERFILE_PATH}" 2>&1 | tee /tmp/docker-build.log
          echo "==> Image metadata"
          docker images react-todo-app:ci
          docker inspect react-todo-app:ci --format 'ExposedPorts: {{json .Config.ExposedPorts}}'

      - name: Verify built artifact (build/index.html present in image)
        run: |
          set -e
          docker run --rm --entrypoint sh react-todo-app:ci -c 'test -f /usr/share/nginx/html/index.html && echo "index.html: OK" && ls -la /usr/share/nginx/html'

      - name: Smoke test container locally (expect HTTP 200 on port 80)
        run: |
          set -e
          docker run -d --name smoke -p 8080:80 react-todo-app:ci
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/ || true)
            [ "$CODE" = "200" ] && break
            sleep 2
          done
          echo "Local smoke test HTTP code: $CODE"
          docker logs smoke || true
          docker rm -f smoke || true
          if [ "$CODE" != "200" ]; then
            echo "ERROR: local container smoke test failed (HTTP $CODE)"
            exit 1
          fi

      - name: Build diagnostics summary
        if: always()
        run: |
          echo "==> Last 100 lines of docker build log"
          tail -n 100 /tmp/docker-build.log || true

  deploy:
    name: Push to ECR & Deploy to EC2 via SSM
    needs: build-diagnose
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ap-south-1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Amazon ECR (direct AWS CLI, static credentials)
        id: login-ecr
        run: |
          set -e
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
          echo "registry=$ECR_REGISTRY" >> "$GITHUB_OUTPUT"

      - name: Build, tag, and push Docker image to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          set -e
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY"
          echo "Building $FULL_IMAGE from context: $DOCKERFILE_PATH"
          docker build --tag "$FULL_IMAGE:$GITHUB_SHA" --tag "$FULL_IMAGE:latest" "$DOCKERFILE_PATH"
          docker push "$FULL_IMAGE:$GITHUB_SHA"
          docker push "$FULL_IMAGE:latest"
          echo "full_image=$FULL_IMAGE" >> "$GITHUB_OUTPUT"

      - name: Resolve target EC2 instance (fallback by tag Name=todo-server)
        id: resolve-instance
        run: |
          set -e
          REGION="$AWS_REGION"
          INSTANCE_ID="$INSTANCE_ID"
          RESOLVED=""
          if [ -n "$INSTANCE_ID" ]; then
            STATE=$(aws ec2 describe-instances --region "$REGION" --instance-ids "$INSTANCE_ID" --query "Reservations[0].Instances[0].State.Name" --output text 2>/dev/null || true)
            [ "$STATE" = "running" ] && RESOLVED="$INSTANCE_ID"
          fi
          if [ -z "$RESOLVED" ]; then
            echo "==> Instance '$INSTANCE_ID' not running; resolving by tag Name=$SERVER_NAME"
            RESOLVED=$(aws ec2 describe-instances --region "$REGION" \
              --filters "Name=tag:Name,Values=$SERVER_NAME" "Name=instance-state-name,Values=running" \
              --query "Reservations[0].Instances[0].InstanceId" --output text 2>/dev/null || true)
          fi
          if [ -z "$RESOLVED" ] || [ "$RESOLVED" = "None" ]; then
            echo "ERROR: could not resolve a running EC2 instance"
            exit 1
          fi
          echo "==> Using instance: $RESOLVED"
          echo "instance_id=$RESOLVED" >> "$GITHUB_OUTPUT"

      - name: Deploy to EC2 via SSM RunShellScript
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          INSTANCE_ID: ${{ steps.resolve-instance.outputs.instance_id }}
        run: |
          set -e
          REGION="$AWS_REGION"
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY"
          IMAGE_URI="$FULL_IMAGE:latest"
          cat > /tmp/ssm-params.json << 'SSMPARAMS'
          {
            "commands": [
              "set -e",
              "export AWS_DEFAULT_REGION=ap-south-1",
              "aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 759204735992.dkr.ecr.ap-south-1.amazonaws.com",
              "docker pull 759204735992.dkr.ecr.ap-south-1.amazonaws.com/todo:latest",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p 80:80 --name app 759204735992.dkr.ecr.ap-south-1.amazonaws.com/todo:latest",
              "docker ps --filter name=app --format '{{.ID}} {{.Status}}'"
            ]
          }
          SSMPARAMS
          COMMAND_ID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --region "$REGION" --document-name "AWS-RunShellScript" --parameters file:///tmp/ssm-params.json --query "Command.CommandId" --output text)
          echo "==> SSM command issued: $COMMAND_ID"
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$REGION" --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "SSM status: $STATUS"
            case "$STATUS" in
              Success) echo "==> SSM deployment succeeded"; break ;;
              InProgress|Pending|Delayed) sleep 5 ;;
              *) echo "==> SSM command failed with status: $STATUS"; aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$REGION" || true; exit 1 ;;
            esac
          done
          if [ "$STATUS" != "Success" ]; then
            echo "ERROR: SSM command did not complete in time"
            exit 1
          fi

  verify:
    name: Verify Production Health
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Health check public URL (expect HTTP 200)
        run: |
          set -e
          URL="http://43.204.71.54"
          CODE="000"
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /tmp/index.html -w '%{http_code}' "$URL/" || true)
            echo "Attempt $i: HTTP $CODE"
            [ "$CODE" = "200" ] && break
            sleep 5
          done
          if [ "$CODE" != "200" ]; then
            echo "ERROR: health check failed with HTTP $CODE"
            exit 1
          fi
          echo "==> Served content (head):"
          head -c 500 /tmp/index.html || true
          echo "Health check passed: $URL returned HTTP 200"